name: Release

# Tagging is the release process: push a v-prefixed tag and this builds every
# platform, attaches the archives, and publishes. Nothing is uploaded by hand,
# so what people download is always what CI built from that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release from"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # These names are a contract: packaging/scripts/install.sh derives
          # the archive URL from `uname`, so renaming one breaks the installer.
          - { target: linux-x86_64,  os: ubuntu-latest }
          - { target: macos-arm64,   os: macos-latest }
          - { target: macos-x86_64,  os: macos-15-intel }
          - { target: windows-x86_64, os: windows-latest }

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libx11-dev libxtst-dev libxrandr-dev libxfixes-dev zlib1g-dev

      - name: Build
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j 4
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake --build build --target macos_bundle --config Release -j 4
          fi

      # A release binary that fails to start is worse than no release. This is
      # the same smoke test CI runs, repeated here because the release build
      # uses different flags.
      - name: Smoke test
        shell: bash
        run: |
          MCP=build/computer-control-mcp
          [ -f build/Release/computer-control-mcp.exe ] && MCP=build/Release/computer-control-mcp.exe
          "$MCP" --version
          "$MCP" --list-tools > /dev/null
          # A release binary that cannot answer a tools/list is broken in a way
          # a --version check would not catch.
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            | "$MCP" | grep -q '"tools"'

      # Signing is what stops Gatekeeper quarantining the download and, more
      # usefully, what makes the Accessibility grant survive an upgrade: an
      # unsigned binary's TCC identity is its code hash, so every new version
      # is a new identity and the user re-grants. A Developer ID certificate
      # keeps the identity stable across releases.
      #
      # Skipped when the secrets are absent, so a fork or a release cut before
      # the certificate exists still produces working (unsigned) archives
      # rather than failing.
      - name: Sign (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          # A throwaway keychain, so nothing is left on the runner and the
          # login keychain is never touched.
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"

          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          # --options runtime is required for notarization.
          codesign --force --timestamp --options runtime \
            --sign "$MACOS_SIGN_IDENTITY" build/computer-control-mcp
          codesign --force --timestamp --options runtime \
            --sign "$MACOS_SIGN_IDENTITY" build/computer-control.app
          codesign --verify --deep --strict --verbose=2 build/computer-control.app

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/computer-control
          # Keep the CLI plus the macOS bundle in the archive. Diagnostics live
          # behind --doctor rather than in a second executable.
          if [ -f build/Release/computer-control-mcp.exe ]; then
            cp build/Release/computer-control-mcp.exe dist/computer-control/
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp build/computer-control-mcp dist/computer-control/
            cp -R build/computer-control.app dist/computer-control/
          else
            cp build/computer-control-mcp dist/computer-control/
          fi
          cp LICENSE README.md dist/computer-control/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "computer-control-${{ matrix.target }}.zip" computer-control > /dev/null
          else
            tar -czf "computer-control-${{ matrix.target }}.tar.gz" computer-control
          fi
          # Checksums are generated next to each archive so a user can verify a
          # download without trusting the page it came from.
          for f in computer-control-${{ matrix.target }}.*; do
            if command -v sha256sum > /dev/null; then sha256sum "$f" > "$f.sha256";
            else shasum -a 256 "$f" > "$f.sha256"; fi
          done
          rm -rf computer-control

      # Notarization is a separate step from signing: Apple has to see the
      # binary and record it. A bare command-line tool cannot be stapled -
      # stapling needs a bundle, dmg or pkg - so Gatekeeper validates online
      # on first run instead. Signing alone still fixes the TCC identity.
      - name: Notarize (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != '' && env.MACOS_NOTARY_KEY != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          echo "$MACOS_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/notarize.zip"' EXIT
          ditto -c -k --keepParent build/computer-control-mcp "$RUNNER_TEMP/notarize.zip"
          SUBMISSION=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER" \
            --no-wait --output-format json)
          SUBMISSION_ID=$(printf '%s\n' "$SUBMISSION" | jq -er '.id')
          echo "Apple notarization submission: $SUBMISSION_ID"

          # Apple can leave a healthy submission in "In Progress" for longer
          # than notarytool's blocking wait. Submit asynchronously, then poll
          # so a slow service does not turn a valid release into a false
          # failure while still giving the job a finite upper bound.
          deadline=$(( $(date +%s) + 3600 ))
          while :; do
            INFO=$(xcrun notarytool info "$SUBMISSION_ID" \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$MACOS_NOTARY_KEY_ID" \
              --issuer "$MACOS_NOTARY_ISSUER" \
              --output-format json)
            STATUS=$(printf '%s\n' "$INFO" | jq -r '.status // "Unknown"')
            echo "Apple notarization status: $STATUS"

            case "$STATUS" in
              Accepted)
                break
                ;;
              Invalid|Rejected)
                printf '%s\n' "$INFO"
                exit 1
                ;;
            esac

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Apple notarization did not finish within 60 minutes."
              printf '%s\n' "$INFO"
              exit 1
            fi
            sleep 30
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -la dist
          # --verify-tag refuses to invent a tag that does not exist, and the
          # notes are generated from the commits since the previous release.
          #
          # Re-running a release must not fail on "already exists": that is how
          # a workflow_dispatch retry after a transient runner failure gets
          # stuck, and it is also how the Homebrew step below never runs.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; replacing its assets"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --verify-tag \
              --generate-notes
          fi

      # Publishing the formula is what makes `brew install` work; doing it by
      # hand means the tap silently lags the release. The checksums come from
      # the .sha256 files CI just produced, never from anything retyped.
      #
      # HOMEBREW_TAP_TOKEN is a PAT with repo scope on minhnd410/homebrew-tap.
      # GITHUB_TOKEN cannot push to another repository, so without the secret
      # this step is skipped rather than failing the release.
      - name: Publish the Homebrew formula
        if: env.TAP_TOKEN != ''
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          python3 packaging/homebrew/render_formula.py "$VERSION" dist > /tmp/computer-control.rb
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/minhnd410/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp /tmp/computer-control.rb /tmp/tap/Formula/computer-control.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/computer-control.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "computer-control $VERSION"
          git push
